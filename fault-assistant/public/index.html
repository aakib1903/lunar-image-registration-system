<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="description" content="Offline troubleshooting assistant for maintenance technicians. English and Gujarati.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
  <title>Fault Assistant · ખામી સહાયક</title>
</head>
<body>
  <a class="skip-link" href="#query">Skip to search</a>

  <header class="app-header">
    <div class="brand">
      <img src="icon.svg" width="40" height="40" alt="">
      <div>
        <h1 data-i18n="appTitle">Fault Assistant</h1>
        <p class="tagline" data-i18n="tagline">Offline troubleshooting from your site manuals</p>
      </div>
    </div>
    <div class="header-side">
      <div class="lang-toggle" role="group" aria-label="Language / ભાષા" id="langToggle"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </header>

  <main class="layout">
    <section class="card query-card" aria-labelledby="queryLabel">
      <label id="queryLabel" for="query" class="field-label" data-i18n="describeLabel">Describe the fault or type the code</label>
      <textarea id="query" rows="3" data-i18n-placeholder="placeholder" placeholder="e.g. motor overheating, E-21, pump no pressure" autocomplete="off" spellcheck="false"></textarea>

      <div class="actions">
        <button type="button" class="btn primary" id="searchBtn" data-i18n="search">Find procedure</button>
        <label class="btn secondary file-btn" for="photo">
          <span data-i18n="photo">Photo of fault or code</span>
        </label>
        <input class="visually-hidden" type="file" id="photo" accept="image/*" capture="environment">
        <button type="button" class="btn ghost" id="clearBtn" data-i18n="clear">Clear</button>
      </div>
      <p class="hint" data-i18n="photoHint">The photo is read on this device and is not uploaded.</p>
      <p class="ocr-status" id="ocrStatus" role="status" aria-live="polite"></p>

      <div class="examples" id="examples">
        <span class="examples-label" data-i18n="examples">Try</span>
      </div>
    </section>

    <section id="results" class="results" aria-live="polite" aria-label="Results"></section>

    <section class="card browse" aria-labelledby="browseTitle">
      <details id="browse">
        <summary id="browseTitle" data-i18n="browse">Browse all faults</summary>
        <ul class="fault-list" id="faultList"></ul>
      </details>
    </section>
  </main>

  <footer class="app-footer">
    <p data-i18n="footer">Advisory aid only. Follow site permit, isolation and lock-out rules. Sample manual content is for demonstration.</p>
    <p class="muted" id="manualMeta"></p>
  </footer>

  <script type="module" src="js/app/app.mjs"></script>
</body>
</html>
